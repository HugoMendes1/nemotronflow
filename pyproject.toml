[project]
name = "nemotronflow"
version = "0.1.0"
description = "Push-to-talk speech-to-text powered by NVIDIA Nemotron 3.5 ASR."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NemotronFlow Contributors" }]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "websockets>=12.0",
    "structlog>=24.1",
    "aiosqlite>=0.19.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
nemo = ["nemo-toolkit[asr]>=1.23"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.2",
    "mypy>=1.8",
]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
nemotronflow = "nemotronflow.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["backend.nemotronflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: tests requiring a CUDA GPU and real NeMo (skipped by default)",
]

[[tool.mypy.overrides]]
module = ["sounddevice.*", "pynput.*", "nemo.*"]
ignore_missing_imports = true
